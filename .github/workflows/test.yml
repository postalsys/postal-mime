name: Run tests

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        strategy:
            matrix:
                node: [20.x, 22.x, 24.x, 26.x]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
            - run: npm install
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
